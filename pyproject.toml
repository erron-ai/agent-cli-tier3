[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cli-tier3"
version = "0.1.0"
description = "Universal agent runner, tester, and manager CLI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "erron.ai"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/erron-ai/agent-cli-tier3"
Issues = "https://github.com/erron-ai/agent-cli-tier3/issues"

[project.scripts]
agent-cli-tier3 = "agent_cli_tier3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
